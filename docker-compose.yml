services:
  bstocks-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binance-bstocks-analysis-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_MCP_URL=${BINANCE_MCP_URL:-https://agent.binance.com/mcp/agentic}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - AGENT_URL=http://bajiao-agent:8080
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DB_PATH=/app/data/bstocks.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backend:/app/backend
    networks:
      - bajiao-net
    depends_on:
      - agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 本地开发用；生产由 scripts/deploy_image.py 部署，两者均不发布 agent 端口。
  agent:
    build: ./agent
    container_name: bajiao-agent
    restart: unless-stopped
    volumes:
      - ./data/agent:/agent-data
    networks:
      - bajiao-net

networks:
  bajiao-net:
    name: bajiao-net
